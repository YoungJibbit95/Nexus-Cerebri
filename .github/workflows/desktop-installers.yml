name: Lab desktop installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: cerebri-lab-windows
          - os: ubuntu-latest
            artifact: cerebri-lab-linux
          - os: macos-latest
            artifact: cerebri-lab-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/cerebri-lab/package-lock.json
      - run: npm ci
        working-directory: apps/cerebri-lab
      - run: npm run desktop:installer
        working-directory: apps/cerebri-lab
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: apps/cerebri-lab/desktop-dist/
          if-no-files-found: error
